# APK tier: a SPECIALIST image, for a contest with a 1 GB limit on the compressed
# upload. Not a generalist: queue only Android / Java challenges on it (also an
# APK hidden in a pcap or an archive), after the core image has had its turn.
#
# Why it exists: on the core tier the APK challenge of the suite was solved once
# in three runs, at 3x the time; with jadx (medium tier) it was solved at the
# first pass. jadx needs Java, about 690 MB on disk, which does not fit beside
# everything in core. So this tier is core's rev and file-carving tools plus
# jadx, apktool and dex2jar, and without everything else.
#
# NOT BUILT OR MEASURED when written (19 November). Estimate: about 0.9 GB
# compressed. If the build is over the limit, see "too big" at the bottom.
# Read by scripts/image_tier.sh; plain bash.

APT=(
  # rev
  gdb gdbserver radare2 binutils file xxd bsdextrautils patchelf ltrace strace
  checksec upx-ucl nasm libc6-dbg elfutils
  libc6-i386 lib32stdc++6
  openssl
  # getting the APK out of whatever it arrives in
  binwalk exiftool tshark tcpdump tcpflow foremost scalpel sleuthkit
  p7zip-full unrar-free yara
  # the point of this tier (they bring Java with them)
  apktool jadx dex2jar apksigner
  # an app's data and its server
  sqlite3 nmap socat netcat-traditional dnsutils openssh-client sshpass telnet ftp
  iproute2 iputils-ping
  # archives / encodings
  jq zip xz-utils zstd lz4 bzip2
)

# The build stops if one of these is missing after the apt stage.
NEED=(gdb objdump readelf strings file xxd binwalk exiftool tshark curl nmap socat jadx apktool)

GEMS=()

PIP_PKGS=(
  uncompyle6 decompyle3
  volatility3
  "mcp<2" pillow beautifulsoup4 pyjwt websocket-client
)

: "${WITH_ANGR:=0}"            # 290 MB on disk. =1 if the build leaves 100 MB of
                               # room: angr decompiles the app's native .so files.
: "${WITH_PWNDBG:=0}"
: "${WITH_RSACTFTOOL:=0}"
: "${WITH_JWT_TOOL:=0}"
: "${WITH_PWNINIT:=1}"
: "${RSACTFTOOL_REF:=}"
: "${JWT_TOOL_REF:=}"
: "${WITH_FOUNDRY:=0}"
: "${WITH_CYBEREDU_MCP:=1}"
: "${WITH_GHIDRA:=0}"
: "${WITH_SAGE:=0}"
: "${SECLISTS:=none}"
: "${ROCKYOU:=0}"

# Too big? In this order: remove sleuthkit, yara, nmap (and nmap from NEED),
# volatility3, tcpdump; then apktool and dex2jar (jadx alone reads an APK).
