# Core tier: what the agent needs to solve entry and medium challenges in every
# category. Small tools stay; what goes is everything large, and everything that
# needs a large runtime (Java, LLVM, Node) to work.
# Target: about 2.5 GB on disk, about 1 GB compressed (estimates; the build
# prints the real numbers). Read by scripts/image_tier.sh; plain bash.
#
# What is left out compared to the full image, and what stands in for it:
#   SageMath          -> gp (PARI/GP), sympy, gmpy2, fpylll
#   Ghidra + Java     -> radare2, objdump, gdb, angr
#   pwndbg            -> plain gdb (the gdb tools fall back by themselves)
#   hashcat           -> john (there is no GPU in the sandbox anyway)
#   SecLists (2 GB)   -> a few MB of it: the lists named in SECLISTS_KEEP
#   qemu-user         -> nothing: a foreign-architecture binary cannot be run
#   apktool/jadx      -> unzip + strings on classes.dex
#   Foundry           -> web3.py with solc
#   ffmpeg, tesseract, imagemagick, node, database clients, smbclient, hydra,
#   the second-line web scanners -> nothing; Pillow and view_image cover
#   pictures.

APT=(
  # rev / pwn
  gdb gdbserver radare2 binutils file xxd bsdextrautils patchelf ltrace strace
  checksec upx-ucl nasm libc6-dbg elfutils
  libc6-i386 lib32stdc++6          # run 32-bit ELF binaries
  # crypto
  pari-gp openssl
  # forensics
  binwalk exiftool tshark tcpdump poppler-utils qpdf foremost scalpel
  sleuthkit testdisk p7zip-full unrar-free yara
  # stego (zbar-tools reads QR codes; nothing else here does)
  steghide stegseek pngcheck outguess stegsnow zbar-tools sox multimon-ng
  # cracking
  john fcrackzip hashid
  # web
  sqlmap ffuf gobuster nmap php-cli sqlite3
  # networking and clients
  socat netcat-traditional dnsutils openssh-client sshpass telnet ftp
  iproute2 iputils-ping aircrack-ng
  # archives / encodings
  jq zip xz-utils zstd lz4 bzip2
  # for the gems below (one_gadget, seccomp-tools, zsteg)
  ruby ruby-dev
)

GEMS=(zsteg one_gadget seccomp-tools)

# Best-effort, on top of the fixed set in image_tier.sh (pwntools, ROPgadget,
# z3, capstone, unicorn, pycryptodome, sympy, numpy, gmpy2, requests, scapy).
PIP_PKGS=(
  fpylll cysignals                 # lattices: the stand-in for Sage's LLL
  xortool primefac libnum flask-unsign
  oletools                         # olevba for office documents
  uncompyle6 decompyle3            # .pyc files
  volatility3                      # 10 MB; keeps the volatility tool working
  web3 eth-abi eth-account eth-utils solc-select
  "mcp<2" pillow beautifulsoup4 pyjwt websocket-client
)

: "${WITH_ANGR:=1}"            # +290 MB; symbolic execution for rev
: "${WITH_PWNDBG:=0}"
: "${WITH_RSACTFTOOL:=1}"
: "${WITH_JWT_TOOL:=1}"
: "${WITH_PWNINIT:=1}"
# Commit of each git-installed tool; empty builds the newest. Fill in the
# commits of the rehearsed image to get the same code (/opt/<tool>/.git there).
: "${RSACTFTOOL_REF:=}"
: "${JWT_TOOL_REF:=}"
: "${WITH_FOUNDRY:=0}"
: "${WITH_CYBEREDU_MCP:=1}"    # the contest runs on CyberEDU: keep
: "${WITH_GHIDRA:=0}"
: "${WITH_SAGE:=0}"
: "${SECLISTS:=subset}"        # subset | full | none
