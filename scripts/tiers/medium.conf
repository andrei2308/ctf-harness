# Medium tier: the full toolkit minus its few very large pieces. Everything the
# rehearsals used is still here except SageMath. Read by scripts/image_tier.sh;
# plain bash. Built and checked 2026-11-18: 6.62 GB, see TIERS_REPORT.md.
#
# Left out compared to the full image:
#   SageMath                 the largest single item (with its GAP, Maxima, R,
#                            boost stack); gp, sympy, gmpy2 and fpylll stand in.
#                            WITH_SAGE=1 puts it back, at which point use the
#                            full image instead. 2 solved runs called sage (bdlp,
#                            which core also solved without it).
#   SecLists, all 2 GB of it kept: the lists named in SECLISTS_KEEP (11 MB)
#   hashcat (+ OpenCL/LLVM)  CPU-only in the sandbox; john does the work
#   qemu-user                484 MB, never called in any run (one `which`)
#   commix                   1.8 GB in Kali: it depends on metasploit-framework,
#                            which brings Oracle Instant Client and the mingw
#                            cross-compilers. Never called in any run.
#   frida-tools, objection   need a phone attached; useless in a container
#   Foundry's second copy    the full image has it under /root and /usr/local
#   man pages, docs, locales
# Not in this Kali at all (nor in the full image): outguess, yafu, solidity
# (solc comes from solc-select), wfuzz from pip (wfuzz from apt is here).

APT=(
  # rev / pwn
  gdb gdbserver gdb-multiarch radare2 binutils file xxd bsdextrautils patchelf
  ltrace strace checksec upx-ucl nasm yara libc6-dbg elfutils
  libc6-i386 lib32stdc++6
  # crypto
  pari-gp openssl
  # forensics
  sleuthkit bulk-extractor testdisk scalpel foremost binwalk exiftool tshark
  tcpdump poppler-utils qpdf imagemagick ffmpeg p7zip-full unrar-free cabextract
  pngcheck
  # stego
  steghide stegseek stegsnow zbar-tools sox multimon-ng
  # cracking
  john hashid hydra fcrackzip pdfcrack hcxtools
  # web
  sqlmap gobuster ffuf feroxbuster nikto whatweb wfuzz nmap wafw00f
  php-cli nodejs sqlite3
  # mobile / apk (these bring a Java runtime with them)
  apktool jadx dex2jar apksigner
  # networking and clients
  aircrack-ng socat ngrep tcpflow dnsutils hping3 netcat-traditional
  openssh-client sshpass telnet ftp lftp smbclient default-mysql-client
  postgresql-client redis-tools iproute2 iputils-ping
  # ocr
  tesseract-ocr tesseract-ocr-eng
  # archives / encodings
  jq zip xz-utils zstd lz4 bzip2
  # for the gems below
  ruby ruby-dev
)

GEMS=(zsteg one_gadget seccomp-tools)

PIP_PKGS=(
  fpylll cysignals roca-detect xortool primefac libnum
  flask-unsign factordb-pycli paddingoracle
  oletools uncompyle6 decompyle3 yara-python flare-floss capa
  volatility3 dirsearch arpy pytesseract
  web3 eth-abi eth-account eth-utils slither-analyzer solc-select vyper
  "mcp<2" pillow beautifulsoup4 pyjwt websocket-client matplotlib scipy
)

: "${WITH_ANGR:=1}"
: "${WITH_PWNDBG:=1}"
: "${WITH_RSACTFTOOL:=1}"
: "${WITH_JWT_TOOL:=1}"
: "${WITH_PWNINIT:=1}"
# Commit of each git-installed tool; empty builds the newest. Fill in the
# commits of the rehearsed image to get the same code (/opt/<tool>/.git there).
: "${RSACTFTOOL_REF:=4ffadb014df02988a5325e4bfdf15a92f5dcd044}"
: "${JWT_TOOL_REF:=3bc7407cf2222d6a821dcc19c776e5a1b1cb9a9b}"
: "${WITH_FOUNDRY:=1}"
: "${WITH_CYBEREDU_MCP:=1}"
: "${WITH_GHIDRA:=1}"          # about 1 GB with its Java; the rev workhorse
: "${WITH_SAGE:=0}"
: "${SECLISTS:=subset}"        # subset | full | none
